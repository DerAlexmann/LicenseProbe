name: CI

on:
  push:
    branches: [main]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stil:
    name: Stil (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-stil.txt
      - run: ruff check .

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.12", "3.14"]
    env:
      # Unter Windows gibt es Tkinter immer: Fehlt es, ist das ein Befund und
      # kein Grund, alle Tests der Oberfläche still zu überspringen.
      OBERFLAECHE_PFLICHT: ${{ matrix.os == 'windows-latest' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt
      # Auf den Linux-Läufern fehlt Tkinter; die Tests der Oberfläche
      # überspringen sich nur dort von selbst, die übrigen laufen überall.
      # -rs nennt jeden übersprungenen Test samt Grund im Protokoll.
      - run: python -m pytest tests -q -rs
